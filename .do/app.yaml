name: aluquote-frontend
region: nyc
static_sites:
  - name: aluquote-frontend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    routes:
      - path: /
    environment_slug: node-js
    envs:
      - key: VITE_API_URL
        value: ${VITE_API_URL}
        type: SECRET
        scope: RUN_TIME
